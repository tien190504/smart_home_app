spring.application.name=backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iot_backend}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.time-zone=UTC

app.jwt.secret=${JWT_SECRET:V2VsY29tZVRvSW9UQmFja2VuZFNlY3VyZUp3dEtleUZvckRlbW8xMjM0NTY3ODkw}
app.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

app.mqtt.enabled=${MQTT_ENABLED:false}
app.mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
app.mqtt.client-id=${MQTT_CLIENT_ID:iot-cloud-backend}
app.mqtt.username=${MQTT_USERNAME:}
app.mqtt.password=${MQTT_PASSWORD:}
app.mqtt.telemetry-topic=${MQTT_TELEMETRY_TOPIC:iot/devices/+/telemetry}
app.mqtt.status-topic=${MQTT_STATUS_TOPIC:iot/devices/+/status}
app.mqtt.command-topic-template=${MQTT_COMMAND_TOPIC_TEMPLATE:iot/devices/%s/commands}
app.mqtt.qos=${MQTT_QOS:1}
app.mqtt.completion-timeout=${MQTT_COMPLETION_TIMEOUT:5000}

app.devices.offline-timeout-ms=${DEVICE_OFFLINE_TIMEOUT_MS:30000}
app.automation.poll-interval-ms=${AUTOMATION_POLL_INTERVAL_MS:15000}
app.assistant.gemini-api-key=${GEMINI_API_KEY:${gemini_api_key:}}
app.assistant.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}

app.bootstrap.admin-full-name=${BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@iot.local}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@123456}

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
